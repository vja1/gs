services:
  - type: web
    name: gstin-lookup-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 180
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DEFAULT_SOURCE
        value: "gst"
      - key: CACHE_TTL
        value: "3600"
      - key: RATE_LIMIT_PER_MIN
        value: "30"
      - key: API_KEY
        sync: false
